<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAMS TV - Visionary</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        
        /* Gaya Header & Logo */
        .header { border-bottom: 2px solid #00f2ff; padding-bottom: 15px; margin-bottom: 20px; }
        .logo-vams { width: 150px; border-radius: 10px; box-shadow: 0 0 20px #00f2ff; }
        
        /* Gaya Layar Player */
        .player-placeholder { 
            width: 100%; max-width: 640px; aspect-ratio: 16/9; 
            background: #1a1a1a; margin: 20px auto; border: 2px solid #00f2ff;
            display: flex; align-items: center; justify-content: center; border-radius: 15px;
            box-shadow: inset 0 0 10px #00f2ff;
        }

        /* Gaya Tombol Kembali */
        .back-btn { 
            display: inline-block; margin-top: 30px; padding: 15px 30px; 
            color: #00f2ff; border: 2px solid #00f2ff; text-decoration: none; 
            border-radius: 12px; font-weight: bold; text-transform: uppercase;
            transition: 0.3s;
        }
        .back-btn:active { transform: scale(0.95); background: rgba(0, 242, 255, 0.1); }
    </style>
</head>
<body>

    <div class="header">
        <img src="logovams.png" class="logo-vams" onerror="this.src='https://via.placeholder.com/150x80?text=VAMS+TV';" alt="VAMS TV">
    </div>

    <h1>LIVE STREAMING VAMS TV</h1>
    
    <div class="player-placeholder">
        <p>📺 Siaran sedang disiapkan...</p>
    </div>

</html>
